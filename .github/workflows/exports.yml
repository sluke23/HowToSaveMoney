name: 构建阅读格式
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei
      - name: 安装导出依赖
        run: python -m pip install -r tools/requirements-export.txt
      - name: 构建 EPUB、PDF、离线 HTML 和 TXT
        run: python tools/export_book.py
      - name: 检查导出文件
        run: python tools/check_exports.py
      - uses: actions/upload-artifact@v4
        with:
          name: reading-formats
          path: |
            dist/HowToSaveMoney.epub
            dist/HowToSaveMoney.pdf
            dist/HowToSaveMoney.html
            dist/HowToSaveMoney.txt
            dist/build-info.json
          if-no-files-found: error
