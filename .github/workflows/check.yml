name: 文档检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装构建依赖
        run: python -m pip install -r tools/requirements.txt
      - name: 检查阅读页是否已同步
        run: python tools/build_site.py --check
      - name: 检查 Skill 资料是否已同步
        run: python tools/build_skill.py --check
      - name: 检查本地链接、表格与来源
        run: python tools/check.py
